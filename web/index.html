<title>WotLK BiS Builds</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#0a090e;--p:#13111a;--ln:#2a2536;--ln2:#362f45;--tx:#ddd8e8;--tn:#918aa5;--go:#d9b45b;--dk:#c41e3a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 Barlow,"Segoe UI",system-ui,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
h1{font:700 clamp(28px,4vw,42px)/1.1 Cinzel,Georgia,serif;color:#f0eaf8;text-align:center;margin-bottom:8px}
.sub{font-size:13px;letter-spacing:4px;text-transform:uppercase;color:var(--go);text-align:center;margin-bottom:40px}
.grid{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:700px}
a.card{display:flex;flex-direction:column;align-items:center;gap:14px;
  background:var(--p);border:1px solid var(--ln);border-radius:12px;
  padding:28px 32px;width:280px;text-decoration:none;color:var(--tx);
  transition:border-color .2s,transform .15s,box-shadow .2s}
a.card:hover{border-color:var(--ln2);transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.card-icon{font-size:48px;line-height:1}
.card-title{font:600 18px/1.2 Cinzel,Georgia,serif;color:#f0eaf8}
.card-role{font-size:12px;color:var(--tn);text-transform:uppercase;letter-spacing:2px}
.card-spec{font-size:13px;color:var(--go)}
footer{margin-top:50px;font-size:10.5px;color:#47425a;text-align:center}
</style>
<h1>Caballero de la Muerte</h1>
<div class="sub">Builds de equipo · WotLK</div>
<div class="grid">
  <a class="card" href="dk-profano.html">
    <div class="card-icon">⚔️</div>
    <div class="card-title">Profano</div>
    <div class="card-role">DPS cuerpo a cuerpo</div>
    <div class="card-spec">16 piezas · ICC 25 heroico</div>
  </a>
  <a class="card" href="dk-sangre.html">
    <div class="card-icon">🛡️</div>
    <div class="card-title">Sangre</div>
    <div class="card-role">Tanque</div>
    <div class="card-spec">16 piezas · ICC 25 heroico</div>
  </a>
</div>
<footer>World of Warcraft © Blizzard Entertainment. Datos verificados contra Wowhead WotLK Classic.</footer>
